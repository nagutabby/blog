name: Deploy blog to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Check, test, and build the site
        run: |
          pnpm --dir web run check
          pnpm --dir web test
          pnpm --dir web build
      - name: Install infrastructure dependencies
        run: pnpm --dir infra install --frozen-lockfile --ignore-scripts
      - name: Configure AWS credentials
        if: vars.BLOG_RESOURCE_MIGRATION_READY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::444167236765:role/blog-github-deploy
          aws-region: ap-northeast-1
      - name: Synthesize and inspect the change
        if: vars.BLOG_RESOURCE_MIGRATION_READY == 'true'
        run: |
          pnpm --dir infra exec cdk synth --strict
          pnpm --dir infra exec cdk diff
      - name: Deploy stacks
        if: vars.BLOG_RESOURCE_MIGRATION_READY == 'true'
        run: pnpm --dir infra exec cdk deploy --all --require-approval never
      - name: Keep production deployment paused during resource migration
        if: vars.BLOG_RESOURCE_MIGRATION_READY != 'true'
        run: echo "Deployment skipped; complete the staged resource migration before setting BLOG_RESOURCE_MIGRATION_READY=true."
