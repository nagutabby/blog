name: CI/CD
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0

      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Worker設定の型を確認
        run: pnpm run worker:types:check

      - name: テストを実行
        run: pnpm test

      - name: 型とSvelteの診断
        run: pnpm check

      - name: 静的サイトをビルド
        run: pnpm build
